<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <h2>Datos Personales</h2>
        <script>
            let nombre=prompt("Escribe tu nombre");
            let edad=prompt("Escribe tu edad");
            let especialidad=prompt("Escribe tu especialidad");
            let direccion=prompt("Escribe tu direccion");

            document.write("Tu nombre es: "+nombre+"<br>");
            document.write("Tienes: "+edad+" años"+"<br>");
            document.write("Tu especialidad es: "+especialidad+"<br>");
            document.write("Vives en: "+direccion);
        </script>
    
    </body>
</html>
